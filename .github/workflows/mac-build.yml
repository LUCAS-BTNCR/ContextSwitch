name: Build Mac (beta)

# Compila ContextSwitch para Mac (Apple Silicon) y sube el .dmg a la release del tag.
# Se dispara solo al publicar una release, o a mano desde Actions eligiendo el tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ej. v0.5.0)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: |
          npm run test:ui
          npm run test:ext
          mkdir -p src-tauri/target/release && touch src-tauri/target/release/cs-bridge
          npm run test:rust

      - name: Build .app + .dmg
        run: npm run build:mac

      - name: Subir el .dmg a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/mac/*.dmg --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ContextSwitch-mac
          path: release/mac/*.dmg
